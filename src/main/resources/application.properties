spring.application.name=training-logbook

# Save the H2 database to a local file named "tracklog" in the "data" directory
spring.datasource.url=jdbc:h2:file:./data/tracklog;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Autimatically create or update the SQL table based on RunEntry.java
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable the browser database viewer at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
